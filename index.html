<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>PDF 圖層、縮放與繪圖檢視器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      display: flex;
      height: 100vh;
      background: #f0f2f5;
      color: #222;
    }
    #sidebar {
      width: 150px;
      flex-shrink: 0;
      background: #ffffff;
      border-right: 1px solid #d9dee7;
      padding: 12px;
      overflow-y: auto;
      transition: width 0.2s ease, padding 0.2s ease;
    }
    #sidebar.collapsed {
      width: 0;
      padding: 0;
      overflow: hidden;
      border-right: none;
    }
    #sidebar h2 {
      margin: 0 0 10px;
      font-size: 16px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      white-space: nowrap;
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 4px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
    }
    .layer-item:hover { background: #f5f7fa; }
    #main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      background: #ffffff;
      border-bottom: 1px solid #d9dee7;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .toolbar.draw-bar {
      border-top: 1px solid #eef2f6;
      background: #fafbfd;
    }
    .toolbar.sticker-bar {
      border-top: 1px solid #eef2f6;
      background: #f8fafc;
    }
    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: #d9dee7;
      margin: 0 2px;
    }
    button, select, input[type="color"], input[type="number"] {
      padding: 5px 9px;
      font-size: 13.5px;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 6px;
      white-space: nowrap;
    }
    input[type="number"] {
      width: 62px;
      cursor: text;
    }
    button:hover:not(:disabled) { background: #f1f5f9; }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.active {
      background: #1d4ed8;
      color: #fff;
      border-color: #1d4ed8;
    }
    input[type="color"] {
      padding: 2px;
      width: 34px;
      height: 30px;
    }
    input[type="range"] {
      width: 82px;
      vertical-align: middle;
      cursor: pointer;
    }
    .inline-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }
    .sticker-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 6px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
    }
    .sticker-btn:hover {
      background: #eff6ff;
      border-color: #3b82f6;
    }
    #viewer-container {
      flex: 1;
      overflow: auto;
      padding: 0;
      text-align: left;
    }
    #canvas-stack {
      position: relative;
      display: inline-block;
      margin: 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      background: #fff;
    }
    #pdf-canvas {
      display: block;
    }
    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
      touch-action: none;
    }
    #vector-draw-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 4;
    }

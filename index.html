<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>PDF 圖層、縮放與繪圖檢視器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      display: flex;
      height: 100vh;
      background: #f0f2f5;
      color: #222;
    }
    #sidebar {
      width: 150px;
      flex-shrink: 0;
      background: #ffffff;
      border-right: 1px solid #d9dee7;
      padding: 12px;
      overflow-y: auto;
      transition: width 0.2s ease, padding 0.2s ease;
    }
    #sidebar.collapsed {
      width: 0;
      padding: 0;
      overflow: hidden;
      border-right: none;
    }
    #sidebar h2 {
      margin: 0 0 10px;
      font-size: 16px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      white-space: nowrap;
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 4px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
    }
    .layer-item:hover { background: #f5f7fa; }
    #main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      background: #ffffff;
      border-bottom: 1px solid #d9dee7;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .toolbar.draw-bar {
      border-top: 1px solid #eef2f6;
      background: #fafbfd;
    }
    .toolbar.sticker-bar {
      border-top: 1px solid #eef2f6;
      background: #f8fafc;
    }
    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: #d9dee7;
      margin: 0 2px;
    }
    button, select, input[type="color"], input[type="number"] {
      padding: 5px 9px;
      font-size: 13.5px;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 6px;
      white-space: nowrap;
    }
    input[type="number"] {
      width: 62px;
      cursor: text;
    }
    button:hover:not(:disabled) { background: #f1f5f9; }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.active {
      background: #1d4ed8;
      color: #fff;
      border-color: #1d4ed8;
    }
    input[type="color"] {
      padding: 2px;
      width: 34px;
      height: 30px;
    }
    input[type="range"] {
      width: 82px;
      vertical-align: middle;
      cursor: pointer;
    }
    .inline-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }
    .sticker-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 6px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
    }
    .sticker-btn:hover {
      background: #eff6ff;
      border-color: #3b82f6;
    }
    #viewer-container {
      flex: 1;
      overflow: auto;
      padding: 0;
      text-align: left;
    }
    #canvas-stack {
      position: relative;
      display: inline-block;
      margin: 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      background: #fff;
    }
    #pdf-canvas {
      display: block;
    }
    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
      touch-action: none;
    }
    #eraser-cursor {
      display: none;
      position: absolute;
      border: 1.5px solid #334155;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.8);
      z-index: 8;
    }
    #overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    .vector-sticker-item {
      position: absolute;
      cursor: move;
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      z-index: 6;
    }
    .vector-sticker-item svg {
      display: block;
      overflow: visible;
    }
    .vector-sticker-item.selected svg {
      filter: drop-shadow(0 0 4px rgba(29, 78, 216, 0.7));
    }
    .sticker-del-badge {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 3px;
      background: #dc2626;
      color: #fff;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      z-index: 12;
    }
    .vector-sticker-item.selected .sticker-del-badge {
      display: inline-block;
    }
    .floating-text-box {
      position: absolute;
      padding: 4px 8px;
      border: 1px dashed rgba(29, 78, 216, 0.65);
      background: rgba(255, 255, 255, 0.88);
      border-radius: 4px;
      cursor: move;
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      line-height: 1.25;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      font-weight: bold;
      z-index: 5;
    }
    .floating-text-box.selected {
      border: 1.5px solid #1d4ed8;
      box-shadow: 0 2px 8px rgba(29, 78, 216, 0.25);
    }
    .floating-text-actions {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 4px;
      gap: 4px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 12px;
      font-weight: normal;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      white-space: nowrap;
      z-index: 10;
    }
    .floating-text-box.selected .floating-text-actions {
      display: inline-flex;
    }
    .floating-text-actions span {
      cursor: pointer;
      padding: 1px 5px;
      color: #1e293b;
    }
    .floating-text-actions span:hover {
      background: #e2e8f0;
      border-radius: 3px;
    }
    .floating-text-actions span.del-btn {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h2>圖層 (Layers)</h2>
    <div id="layers-list">正在載入 PDF 與圖層...</div>
  </aside>

  <section id="main">
    <div class="toolbar">
      <button id="toggle-sidebar">收合圖層</button>
      <span class="toolbar-divider"></span>
      <button id="zoom-out">縮小 (-)</button>
      <span id="zoom-label">150%</span>
      <button id="zoom-in">放大 (+)</button>
      <button id="zoom-150">150%</button>
      <button id="zoom-reset">重設 100%</button>
      <span class="toolbar-divider"></span>
      <button id="layers-check-all">全部勾選</button>
      <button id="layers-uncheck-all">全部取消</button>
    </div>

    <div class="toolbar draw-bar">
      <strong style="font-size: 13.5px;">繪圖工具：</strong>
      <button id="tool-none" class="active">瀏覽模式</button>
      <button id="tool-pen">隨意畫線</button>
      <button id="tool-line">直線</button>
      <button id="tool-arrow">箭頭</button>
      <button id="tool-circle">圓形</button>
      <button id="tool-rect">正方形</button>
      <button id="tool-text">加文字</button>

      <span class="inline-group">
        <button id="tool-eraser">橡皮擦</button>
        <input type="range" id="eraser-size" min="8" max="60" value="20" title="橡皮擦大小" />
        <span id="eraser-size-label">20</span>
      </span>

      <span class="toolbar-divider"></span>

      <label class="inline-group">顏色
        <input type="color" id="draw-color" value="#ff0000" />
      </label>

      <label class="inline-group">線寬
        <select id="line-width">
          <option value="2">細</option>
          <option value="5" selected>中等</option>
          <option value="9">粗</option>
        </select>
      </label>

      <label class="inline-group">字級(8-36)
        <input type="number" id="font-size" min="8" max="36" value="20" />
      </label>

      <button id="draw-undo" disabled>復原上一步</button>
      <button id="draw-clear">清除筆跡</button>
      <span class="toolbar-divider"></span>
      <button id="download-png">下載 PNG</button>
    </div>

    <div class="toolbar sticker-bar">
      <strong style="font-size: 13.5px;">向量貼紙區：</strong>
      <div id="sticker-buttons" style="display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;"></div>
      <span class="toolbar-divider"></span>
      <label class="inline-group">貼紙大小
        <input type="range" id="sticker-scale" min="0.5" max="2.5" step="0.1" value="1" />
        <span id="sticker-scale-label">1.0x</span>
      </label>
    </div>

    <div id="viewer-container">
      <div id="canvas-stack">
        <canvas id="pdf-canvas"></canvas>
        <canvas id="draw-canvas"></canvas>
        <div id="eraser-cursor"></div>
        <div id="overlay-layer"></div>
      </div>
    </div>
  </section>

  <script type="module">
    import * as pdfjsLib from 'https://unpkg.com/pdfjs-dist@4.6.82/build/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://unpkg.com/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs';

    const PDF_URL = './chart.pdf';
    const HIDDEN_NUMBERS = [90, 16, 54];
    const FONT_FAMILY = '"Microsoft JhengHei", "Noto Sans TC", sans-serif';

    const STICKER_DEFS = [
      { key: 'wind', label: '風', shape: 'circle', fill: '#00f0ff', textColor: '#ffffff' },
      { key: 'cold', label: '寒', shape: 'circle', fill: '#000000', textColor: '#ffffff' },
      { key: 'summer', label: '暑', shape: 'circle', fill: '#ff00ff', textColor: '#ffffff' },
      { key: 'damp', label: '濕', shape: 'circle', fill: '#ff8000', textColor: '#ffffff' },
      { key: 'dry', label: '燥', shape: 'circle', fill: '#a6a6a6', textColor: '#ffffff' },
      { key: 'fire', label: '火', shape: 'circle', fill: '#ff0000', textColor: '#ffffff' },
      { key: 'bacteria', label: '細菌', shape: 'oval', fill: 'none', stroke: '#000000', textColor: '#000000' },
      { key: 'virus', label: '病毒', shape: 'oval', fill: 'none', stroke: '#000000', textColor: '#000000' },
    ];

    let pdfDoc = null;
    let scale = 1.5;
    let optionalContentConfig = null;
    let renderTask = null;
    let visibleGroupIds = [];

    let activeTool = 'none';
    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    let snapshot = null;
    let hasStrokeMoved = false;
    const undoStack = [];
    const MAX_UNDO = 30;

    let textItems = [];
    let selectedTextId = null;
    let draggingTextId = null;
    let textDragOffsetX = 0;
    let textDragOffsetY = 0;

    let stickerItems = [];
    let selectedStickerId = null;
    let draggingStickerId = null;
    let stickerDragOffsetX = 0;
    let stickerDragOffsetY = 0;

    const sidebarEl = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggle-sidebar');
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    const eraserCursorEl = document.getElementById('eraser-cursor');
    const overlayLayerEl = document.getElementById('overlay-layer');
    const stickerButtonsEl = document.getElementById('sticker-buttons');
    const stickerScaleInput = document.getElementById('sticker-scale');
    const stickerScaleLabel = document.getElementById('sticker-scale-label');
    const layersListEl = document.getElementById('layers-list');
    const zoomLabelEl = document.getElementById('zoom-label');
    const viewerContainerEl = document.getElementById('viewer-container');
    const colorInput = document.getElementById('draw-color');
    const lineWidthSelect = document.getElementById('line-width');
    const fontSizeInput = document.getElementById('font-size');
    const eraserSizeInput = document.getElementById('eraser-size');
    const eraserSizeLabel = document.getElementById('eraser-size-label');
    const undoBtn = document.getElementById('draw-undo');
    const clearBtn = document.getElementById('draw-clear');
    const downloadPngBtn = document.getElementById('download-png');

    function createStickerSvgElement(def, itemScale = 1) {
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');

      if (def.shape === 'circle') {
        const baseSize = 68;
        const size = Math.round(baseSize * itemScale);
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('width', size);
        svg.setAttribute('height', size);

        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', '50');
        circle.setAttribute('cy', '50');
        circle.setAttribute('r', '46');
        circle.setAttribute('fill', def.fill);
        svg.appendChild(circle);

        const text = document.createElementNS(svgNS, 'text');
        text.setAttribute('x', '50');
        text.setAttribute('y', '53');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', def.textColor);
        text.setAttribute('font-size', '52');
        text.setAttribute('font-weight', 'bold');
        text.setAttribute('font-family', FONT_FAMILY);
        text.textContent = def.label;
        svg.appendChild(text);
      } else {
        const baseW = 112;
        const baseH = 68;
        const w = Math.round(baseW * itemScale);
        const h = Math.round(baseH * itemScale);
        svg.setAttribute('viewBox', '0 0 160 100');
        svg.setAttribute('width', w);
        svg.setAttribute('height', h);

        const ellipse = document.createElementNS(svgNS, 'ellipse');
        ellipse.setAttribute('cx', '80');
        ellipse.setAttribute('cy', '50');
        ellipse.setAttribute('rx', '73');
        ellipse.setAttribute('ry', '42');
        ellipse.setAttribute('fill', def.fill);
        ellipse.setAttribute('stroke', def.stroke || '#000000');
        ellipse.setAttribute('stroke-width', '7');
        svg.appendChild(ellipse);

        const text = document.createElementNS(svgNS, 'text');
        text.setAttribute('x', '80');
        text.setAttribute('y', '52');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', def.textColor);
        text.setAttribute('font-size', '44');
        text.setAttribute('font-weight', 'bold');
        text.setAttribute('font-family', FONT_FAMILY);
        text.textContent = def.label;
        svg.appendChild(text);
      }

      return svg;
    }

    function initStickerButtons() {
      stickerButtonsEl.innerHTML = '';
      for (const def of STICKER_DEFS) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sticker-btn';
        btn.title = `加入向量貼紙：${def.label}`;
        btn.appendChild(createStickerSvgElement(def, 0.42));
        btn.addEventListener('click', () => {
          pushUndoState();
          const currentScale = Number(stickerScaleInput.value) || 1;
          const offsetIndex = stickerItems.length % 8;
          const newSticker = {
            id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            key: def.key,
            x: 24 + offsetIndex * 18,
            y: 24 + offsetIndex * 18,
            stickerScale: currentScale,
          };
          stickerItems.push(newSticker);
          selectedStickerId = newSticker.id;
          selectedTextId = null;
          renderOverlays();
        });
        stickerButtonsEl.appendChild(btn);
      }
    }

    stickerScaleInput.addEventListener('input', () => {
      const val = Number(stickerScaleInput.value) || 1;
      stickerScaleLabel.textContent = `${val.toFixed(1)}x`;
      if (selectedStickerId !== null) {
        const target = stickerItems.find((s) => s.id === selectedStickerId);
        if (target) {
          target.stickerScale = val;
          renderOverlays();
        }
      }
    });

    function updateEraserCursorSize() {
      const size = Number(eraserSizeInput.value);
      eraserCursorEl.style.width = `${size}px`;
      eraserCursorEl.style.height = `${size}px`;
    }

    function updateEraserCursorPosition(x, y) {
      if (activeTool !== 'eraser') {
        eraserCursorEl.style.display = 'none';
        return;
      }
      updateEraserCursorSize();
      eraserCursorEl.style.left = `${x}px`;
      eraserCursorEl.style.top = `${y}px`;
      eraserCursorEl.style.display = 'block';
    }

    eraserSizeInput.addEventListener('input', () => {
      eraserSizeLabel.textContent = eraserSizeInput.value;
      updateEraserCursorSize();
    });

    function clampFontSize(val) {
      const num = parseInt(val, 10);
      if (Number.isNaN(num)) return 20;
      return Math.min(36, Math.max(8, num));
    }

    fontSizeInput.addEventListener('change', () => {
      const validSize = clampFontSize(fontSizeInput.value);
      fontSizeInput.value = validSize;

      if (selectedTextId !== null) {
        const target = textItems.find((t) => t.id === selectedTextId);
        if (target && target.fontSize !== validSize) {
          pushUndoState();
          target.fontSize = validSize;
          renderOverlays();
        }
      }
    });

    function createSnapshotRecord() {
      return {
        canvasDataUrl: drawCanvas.toDataURL('image/png'),
        texts: textItems.map((t) => ({ ...t })),
        stickers: stickerItems.map((s) => ({ ...s })),
      };
    }

    function updateUndoButton() {
      undoBtn.disabled = undoStack.length === 0;
    }

    function pushUndoState() {
      if (drawCanvas.width === 0 || drawCanvas.height === 0) return;
      undoStack.push(createSnapshotRecord());
      if (undoStack.length > MAX_UNDO) {
        undoStack.shift();
      }
      updateUndoButton();
    }

    function restoreRecord(record) {
      return new Promise((resolve) => {
        textItems = (record.texts || []).map((t) => ({ ...t }));
        stickerItems = (record.stickers || []).map((s) => ({ ...s }));
        selectedTextId = null;
        selectedStickerId = null;
        renderOverlays();

        const img = new Image();
        img.onload = () => {
          drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
          drawCtx.drawImage(img, 0, 0, drawCanvas.width, drawCanvas.height);
          resolve();
        };
        img.src = record.canvasDataUrl;
      });
    }

    undoBtn.addEventListener('click', async () => {
      if (undoStack.length === 0) return;
      const prevRecord = undoStack.pop();
      updateUndoButton();
      await restoreRecord(prevRecord);
    });

    clearBtn.addEventListener('click', () => {
      const hasAnyPixel = drawCtx
        .getImageData(0, 0, drawCanvas.width || 1, drawCanvas.height || 1)
        .data.some((alpha) => alpha !== 0);
      if (hasAnyPixel || textItems.length > 0 || stickerItems.length > 0) {
        pushUndoState();
      }
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      textItems = [];
      stickerItems = [];
      selectedTextId = null;
      selectedStickerId = null;
      renderOverlays();
    });

    function renderOverlays() {
      overlayLayerEl.innerHTML = '';

      for (const sItem of stickerItems) {
        const def = STICKER_DEFS.find((d) => d.key === sItem.key);
        if (!def) continue;

        const wrap = document.createElement('div');
        wrap.className = 'vector-sticker-item' + (sItem.id === selectedStickerId ? ' selected' : '');
        wrap.style.left = `${sItem.x}px`;
        wrap.style.top = `${sItem.y}px`;

        const svgEl = createStickerSvgElement(def, sItem.stickerScale || 1);
        wrap.appendChild(svgEl);

        const delBadge = document.createElement('span');
        delBadge.className = 'sticker-del-badge';
        delBadge.textContent = '刪除';
        delBadge.addEventListener('pointerdown', (e) => e.stopPropagation());
        delBadge.addEventListener('click', (e) => {
          e.stopPropagation();
          pushUndoState();
          stickerItems = stickerItems.filter((s) => s.id !== sItem.id);
          if (selectedStickerId === sItem.id) selectedStickerId = null;
          renderOverlays();
        });
        wrap.appendChild(delBadge);

        wrap.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          selectedStickerId = sItem.id;
          selectedTextId = null;
          stickerScaleInput.value = sItem.stickerScale || 1;
          stickerScaleLabel.textContent = `${Number(sItem.stickerScale || 1).toFixed(1)}x`;
          renderOverlays();

          const currentWrap = overlayLayerEl.querySelector('.vector-sticker-item.selected');
          if (!currentWrap) return;

          pushUndoState();
          draggingStickerId = sItem.id;
          const stackRect = overlayLayerEl.getBoundingClientRect();
          stickerDragOffsetX = e.clientX - stackRect.left - sItem.x;
          stickerDragOffsetY = e.clientY - stackRect.top - sItem.y;
          currentWrap.setPointerCapture(e.pointerId);
        });

        wrap.addEventListener('pointermove', (e) => {
          if (draggingStickerId !== sItem.id) return;
          const stackRect = overlayLayerEl.getBoundingClientRect();
          sItem.x = Math.max(0, e.clientX - stackRect.left - stickerDragOffsetX);
          sItem.y = Math.max(0, e.clientY - stackRect.top - stickerDragOffsetY);
          wrap.style.left = `${sItem.x}px`;
          wrap.style.top = `${sItem.y}px`;
        });

        const stopStickerDrag = (e) => {
          if (draggingStickerId === sItem.id) {
            draggingStickerId = null;
            if (e && wrap.hasPointerCapture(e.pointerId)) {
              wrap.releasePointerCapture(e.pointerId);
            }
          }
        };

        wrap.addEventListener('pointerup', stopStickerDrag);
        wrap.addEventListener('pointercancel', stopStickerDrag);

        overlayLayerEl.appendChild(wrap);
      }

      for (const item of textItems) {
        const box = document.createElement('div');
        box.className = 'floating-text-box' + (item.id === selectedTextId ? ' selected' : '');
        box.style.left = `${item.x}px`;
        box.style.top = `${item.y}px`;
        box.style.color = item.color;
        box.style.fontSize = `${item.fontSize}px`;
        box.style.fontFamily = FONT_FAMILY;

        const actions = document.createElement('div');
        actions.className = 'floating-text-actions';

        const editSpan = document.createElement('span');
        editSpan.textContent = '編輯';
        editSpan.addEventListener('pointerdown', (e) => e.stopPropagation());
        editSpan.addEventListener('click', (e) => {
          e.stopPropagation();
          const updated = prompt('修改文字內容：', item.text);
          if (updated && updated.trim()) {
            pushUndoState();
            item.text = updated.trim();
            renderOverlays();
          }
        });

        const delSpan = document.createElement('span');
        delSpan.className = 'del-btn';
        delSpan.textContent = '刪除';
        delSpan.addEventListener('pointerdown', (e) => e.stopPropagation());
        delSpan.addEventListener('click', (e) => {
          e.stopPropagation();
          pushUndoState();
          textItems = textItems.filter((t) => t.id !== item.id);
          if (selectedTextId === item.id) selectedTextId = null;
          renderOverlays();
        });

        const contentSpan = document.createElement('span');
        contentSpan.textContent = item.text;

        box.appendChild(contentSpan);
        box.appendChild(actions);
        actions.appendChild(editSpan);
        actions.appendChild(delSpan);

        box.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          selectedTextId = item.id;
          selectedStickerId = null;
          fontSizeInput.value = item.fontSize;
          renderOverlays();

          const targetBox = overlayLayerEl.querySelector('.floating-text-box.selected');
          if (!targetBox) return;

          pushUndoState();
          draggingTextId = item.id;
          const stackRect = overlayLayerEl.getBoundingClientRect();
          textDragOffsetX = e.clientX - stackRect.left - item.x;
          textDragOffsetY = e.clientY - stackRect.top - item.y;
          targetBox.setPointerCapture(e.pointerId);
        });

        box.addEventListener('pointermove', (e) => {
          if (draggingTextId !== item.id) return;
          const stackRect = overlayLayerEl.getBoundingClientRect();
          item.x = Math.max(0, e.clientX - stackRect.left - textDragOffsetX);
          item.y = Math.max(0, e.clientY - stackRect.top - textDragOffsetY);
          box.style.left = `${item.x}px`;
          box.style.top = `${item.y}px`;
        });

        const stopTextDrag = (e) => {
          if (draggingTextId === item.id) {
            draggingTextId = null;
            if (e && box.hasPointerCapture(e.pointerId)) {
              box.releasePointerCapture(e.pointerId);
            }
          }
        };

        box.addEventListener('pointerup', stopTextDrag);
        box.addEventListener('pointercancel', stopTextDrag);

        overlayLayerEl.appendChild(box);
      }
    }

    overlayLayerEl.addEventListener('pointerdown', (e) => {
      if (e.target === overlayLayerEl) {
        selectedTextId = null;
        selectedStickerId = null;
        renderOverlays();
      }
    });

    function renderSvgToContext(def, itemScale, targetCtx, x, y) {
      const svgEl = createStickerSvgElement(def, itemScale);
      const w = Number(svgEl.getAttribute('width'));
      const h = Number(svgEl.getAttribute('height'));
      const xml = new XMLSerializer().serializeToString(svgEl);
      const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          targetCtx.drawImage(img, x, y, w, h);
          URL.revokeObjectURL(url);
          resolve();
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          resolve();
        };
        img.src = url;
      });
    }

    downloadPngBtn.addEventListener('click', async () => {
      if (canvas.width === 0 || canvas.height === 0) return;
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const exportCtx = exportCanvas.getContext('2d');

      exportCtx.drawImage(canvas, 0, 0);
      exportCtx.drawImage(drawCanvas, 0, 0);

      for (const sItem of stickerItems) {
        const def = STICKER_DEFS.find((d) => d.key === sItem.key);
        if (def) {
          await renderSvgToContext(def, sItem.stickerScale || 1, exportCtx, sItem.x, sItem.y);
        }
      }

      for (const item of textItems) {
        exportCtx.save();
        exportCtx.font = `bold ${item.fontSize}px ${FONT_FAMILY}`;
        exportCtx.fillStyle = item.color;
        exportCtx.textBaseline = 'top';
        exportCtx.fillText(item.text, item.x + 8, item.y + 4);
        exportCtx.restore();
      }

      const link = document.createElement('a');
      const now = new Date();
      const stamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
      link.download = `chart_annotated_${Math.round(scale * 100)}pct_${stamp}.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });

    const toolButtons = {
      none: document.getElementById('tool-none'),
      pen: document.getElementById('tool-pen'),
      line: document.getElementById('tool-line'),
      arrow: document.getElementById('tool-arrow'),
      circle: document.getElementById('tool-circle'),
      rect: document.getElementById('tool-rect'),
      text: document.getElementById('tool-text'),
      eraser: document.getElementById('tool-eraser'),
    };

    function setTool(toolName) {
      activeTool = toolName;
      Object.entries(toolButtons).forEach(([key, btn]) => {
        btn.classList.toggle('active', key === toolName);
      });
      if (toolName === 'eraser') {
        drawCanvas.style.cursor = 'none';
        updateEraserCursorSize();
      } else {
        eraserCursorEl.style.display = 'none';
        drawCanvas.style.cursor = toolName === 'none' ? 'default' : 'crosshair';
      }
    }

    Object.entries(toolButtons).forEach(([key, btn]) => {
      btn.addEventListener('click', () => setTool(key));
    });

    function getCanvasCoords(e) {
      const rect = drawCanvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
      };
    }

    function drawArrowShape(targetCtx, x1, y1, x2, y2, lineWidth, color) {
      const headLen = Math.max(12, lineWidth * 3.2);
      const angle = Math.atan2(y2 - y1, x2 - x1);

      targetCtx.save();
      targetCtx.strokeStyle = color;
      targetCtx.fillStyle = color;
      targetCtx.lineWidth = lineWidth;
      targetCtx.lineCap = 'round';
      targetCtx.lineJoin = 'round';

      targetCtx.beginPath();
      targetCtx.moveTo(x1, y1);
      targetCtx.lineTo(x2, y2);
      targetCtx.stroke();

      targetCtx.beginPath();
      targetCtx.moveTo(x2, y2);
      targetCtx.lineTo(
        x2 - headLen * Math.cos(angle - Math.PI / 6),
        y2 - headLen * Math.sin(angle - Math.PI / 6)
      );
      targetCtx.lineTo(
        x2 - headLen * Math.cos(angle + Math.PI / 6),
        y2 - headLen * Math.sin(angle + Math.PI / 6)
      );
      targetCtx.closePath();
      targetCtx.fill();
      targetCtx.restore();
    }

    drawCanvas.addEventListener('pointerdown', (e) => {
      if (activeTool === 'none') return;
      const { x, y } = getCanvasCoords(e);
      updateEraserCursorPosition(x, y);

      if (activeTool === 'text') {
        const text = prompt('請輸入要加入的文字（預設微軟正黑體，建立後可拖曳移動位置）：');
        if (text && text.trim()) {
          pushUndoState();
          const fontSize = clampFontSize(fontSizeInput.value);
          fontSizeInput.value = fontSize;
          const newItem = {
            id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            text: text.trim(),
            x,
            y,
            color: colorInput.value,
            fontSize,
          };
          textItems.push(newItem);
          selectedTextId = newItem.id;
          selectedStickerId = null;
          renderOverlays();
        }
        return;
      }

      pushUndoState();
      isDrawing = true;
      hasStrokeMoved = false;
      startX = x;
      startY = y;
      drawCanvas.setPointerCapture(e.pointerId);

      if (['line', 'arrow', 'circle', 'rect'].includes(activeTool)) {
        snapshot = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
      } else if (activeTool === 'pen' || activeTool === 'eraser') {
        drawCtx.beginPath();
        drawCtx.moveTo(x, y);
      }
    });

    drawCanvas.addEventListener('pointermove', (e) => {
      const { x, y } = getCanvasCoords(e);
      updateEraserCursorPosition(x, y);

      if (!isDrawing || activeTool === 'none' || activeTool === 'text') return;
      const lineWidth = Number(lineWidthSelect.value);
      const color = colorInput.value;
      hasStrokeMoved = true;

      if (activeTool === 'pen') {
        drawCtx.save();
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.strokeStyle = color;
        drawCtx.lineWidth = lineWidth;
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.lineTo(x, y);
        drawCtx.stroke();
        drawCtx.restore();
      } else if (activeTool === 'eraser') {
        drawCtx.save();
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.lineWidth = Number(eraserSizeInput.value);
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.lineTo(x, y);
        drawCtx.stroke();
        drawCtx.restore();
      } else if (snapshot) {
        drawCtx.putImageData(snapshot, 0, 0);

        if (activeTool === 'line') {
          drawCtx.save();
          drawCtx.strokeStyle = color;
          drawCtx.lineWidth = lineWidth;
          drawCtx.lineCap = 'round';
          drawCtx.beginPath();
          drawCtx.moveTo(startX, startY);
          drawCtx.lineTo(x, y);
          drawCtx.stroke();
          drawCtx.restore();
        } else if (activeTool === 'arrow') {
          drawArrowShape(drawCtx, startX, startY, x, y, lineWidth, color);
        } else if (activeTool === 'circle') {
          const rx = Math.abs(x - startX) / 2;
          const ry = Math.abs(y - startY) / 2;
          const cx = Math.min(x, startX) + rx;
          const cy = Math.min(y, startY) + ry;

          drawCtx.save();
          drawCtx.strokeStyle = color;
          drawCtx.lineWidth = lineWidth;
          drawCtx.beginPath();
          drawCtx.ellipse(cx, cy, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2);
          drawCtx.stroke();
          drawCtx.restore();
        } else if (activeTool === 'rect') {
          drawCtx.save();
          drawCtx.strokeStyle = color;
          drawCtx.lineWidth = lineWidth;
          drawCtx.strokeRect(
            Math.min(x, startX),
            Math.min(y, startY),
            Math.abs(x - startX),
            Math.abs(y - startY)
          );
          drawCtx.restore();
        }
      }
    });

    drawCanvas.addEventListener('pointerleave', () => {
      eraserCursorEl.style.display = 'none';
    });

    function finishDrawing(e) {
      if (!isDrawing) return;
      isDrawing = false;
      snapshot = null;
      if (!hasStrokeMoved && undoStack.length > 0) {
        undoStack.pop();
        updateUndoButton();
      }
      hasStrokeMoved = false;
      if (e && drawCanvas.hasPointerCapture(e.pointerId)) {
        drawCanvas.releasePointerCapture(e.pointerId);
      }
    }

    drawCanvas.addEventListener('pointerup', finishDrawing);
    drawCanvas.addEventListener('pointercancel', finishDrawing);

    toggleSidebarBtn.addEventListener('click', () => {
      const isCollapsed = sidebarEl.classList.toggle('collapsed');
      toggleSidebarBtn.textContent = isCollapsed ? '展開圖層' : '收合圖層';
    });

    function extractLeadingNumber(name) {
      const normalized = String(name || '')
        .replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xfee0))
        .trim();
      const match = normalized.match(/^(\d+)/);
      return match ? parseInt(match[1], 10) : Number.MAX_SAFE_INTEGER;
    }

    function isHiddenLayer(name) {
      const num = extractLeadingNumber(name);
      return HIDDEN_NUMBERS.includes(num);
    }

    async function renderLayersUI() {
      layersListEl.innerHTML = '';
      visibleGroupIds = [];

      if (!optionalContentConfig) {
        layersListEl.textContent = '此 PDF 未包含圖層資訊';
        return;
      }

      const groups = optionalContentConfig.getGroups();
      if (!groups || Object.keys(groups).length === 0) {
        layersListEl.textContent = '找不到可用圖層';
        return;
      }

      for (const [groupId, group] of Object.entries(groups)) {
        const layerName = group.name || groupId;
        if (isHiddenLayer(layerName)) {
          optionalContentConfig.setVisibility(groupId, false);
        }
      }

      const entries = Object.entries(groups)
        .filter(([groupId, group]) => !isHiddenLayer(group.name || groupId))
        .sort((a, b) => {
          const nameA = a[1].name || a[0];
          const nameB = b[1].name || b[0];
          const numA = extractLeadingNumber(nameA);
          const numB = extractLeadingNumber(nameB);

          if (numA !== numB) return numA - numB;
          return String(nameA).localeCompare(String(nameB), 'zh-Hant');
        });

      for (const [groupId, group] of entries) {
        visibleGroupIds.push(groupId);

        const label = document.createElement('label');
        label.className = 'layer-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.dataset.groupId = groupId;
        checkbox.checked = optionalContentConfig.isVisible(groupId);

        checkbox.addEventListener('change', async () => {
          optionalContentConfig.setVisibility(groupId, checkbox.checked);
          await renderPage();
        });

        const text = document.createElement('span');
        text.textContent = group.name || groupId;

        label.appendChild(checkbox);
        label.appendChild(text);
        layersListEl.appendChild(label);
      }
    }

    async function setAllLayersVisibility(checked) {
      if (!optionalContentConfig || visibleGroupIds.length === 0) return;

      for (const groupId of visibleGroupIds) {
        optionalContentConfig.setVisibility(groupId, checked);
      }

      const checkboxes = layersListEl.querySelectorAll('input[type="checkbox"]');
      checkboxes.forEach((cb) => {
        cb.checked = checked;
      });

      await renderPage();
    }

    async function renderPage() {
      if (!pdfDoc) return;
      if (renderTask) renderTask.cancel();

      const page = await pdfDoc.getPage(1);
      const viewport = page.getViewport({ scale });

      canvas.height = viewport.height;
      canvas.width = viewport.width;

      const prevDrawing = document.createElement('canvas');
      prevDrawing.width = drawCanvas.width;
      prevDrawing.height = drawCanvas.height;
      prevDrawing.getContext('2d').drawImage(drawCanvas, 0, 0);

      drawCanvas.height = viewport.height;
      drawCanvas.width = viewport.width;
      drawCtx.drawImage(prevDrawing, 0, 0, drawCanvas.width, drawCanvas.height);

      overlayLayerEl.style.width = `${viewport.width}px`;
      overlayLayerEl.style.height = `${viewport.height}px`;
      renderOverlays();

      zoomLabelEl.textContent = `${Math.round(scale * 100)}%`;
      viewerContainerEl.scrollTop = 0;
      viewerContainerEl.scrollLeft = 0;

      renderTask = page.render({
        canvasContext: ctx,
        viewport,
        optionalContentConfigPromise: Promise.resolve(optionalContentConfig),
      });

      try {
        await renderTask.promise;
      } catch (err) {
        if (err?.name !== 'RenderingCancelledException') {
          console.error(err);
        }
      }
    }

    document.getElementById('zoom-in').addEventListener('click', async () => {
      scale = Math.min(6.0, +(scale + 0.5).toFixed(2));
      await renderPage();
    });

    document.getElementById('zoom-out').addEventListener('click', async () => {
      scale = Math.max(0.25, +(scale - 0.5).toFixed(2));
      await renderPage();
    });

    document.getElementById('zoom-150').addEventListener('click', async () => {
      scale = 1.5;
      await renderPage();
    });

    document.getElementById('zoom-reset').addEventListener('click', async () => {
      scale = 1.0;
      await renderPage();
    });

    document.getElementById('layers-check-all').addEventListener('click', async () => {
      await setAllLayersVisibility(true);
    });

    document.getElementById('layers-uncheck-all').addEventListener('click', async () => {
      await setAllLayersVisibility(false);
    });

    initStickerButtons();

    async function init() {
      const timer = setTimeout(() => {
        if (layersListEl.textContent.includes('正在載入')) {
          layersListEl.textContent = '載入逾時，請按 F12 → 主控台查看是否有網路或 PDF 解析訊息。';
        }
      }, 10000);

      try {
        const loadingTask = pdfjsLib.getDocument(PDF_URL);
        pdfDoc = await loadingTask.promise;

        try {
          optionalContentConfig = await pdfDoc.getOptionalContentConfig();
        } catch (ocErr) {
          console.warn('讀取圖層設定發生警告:', ocErr);
          optionalContentConfig = null;
        }

        await renderLayersUI();
        await renderPage();
      } catch (err) {
        layersListEl.textContent = `載入失敗：${err?.message || '請確認 chart.pdf 是否與 index.html 在同一層。'}`;
        console.error('PDF 載入錯誤:', err);
      } finally {
        clearTimeout(timer);
      }
    }

    init();
  </script>
</body>
</html>

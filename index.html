<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>PDF 圖層、縮放與繪圖檢視器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      display: flex;
      height: 100vh;
      background: #f0f2f5;
      color: #222;
    }
    #sidebar {
      width: 150px;
      flex-shrink: 0;
      background: #ffffff;
      border-right: 1px solid #d9dee7;
      padding: 12px;
      overflow-y: auto;
      transition: width 0.2s ease, padding 0.2s ease;
    }
    #sidebar.collapsed {
      width: 0;
      padding: 0;
      overflow: hidden;
      border-right: none;
    }
    #sidebar h2 {
      margin: 0 0 10px;
      font-size: 16px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      white-space: nowrap;
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 4px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
    }
    .layer-item:hover { background: #f5f7fa; }
    #main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      background: #ffffff;
      border-bottom: 1px solid #d9dee7;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .toolbar.draw-bar {
      border-top: 1px solid #eef2f6;
      background: #fafbfd;
    }
    .toolbar.sticker-bar {
      border-top: 1px solid #eef2f6;
      background: #f8fafc;
    }
    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: #d9dee7;
      margin: 0 2px;
    }
    button, select, input[type="number"] {
      padding: 5px 9px;
      font-size: 13.5px;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 6px;
      white-space: nowrap;
    }
    input[type="number"] {
      width: 62px;
      cursor: text;
    }
    button:hover:not(:disabled) { background: #f1f5f9; }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.active {
      background: #1d4ed8;
      color: #fff;
      border-color: #1d4ed8;
    }
    input[type="range"] {
      width: 82px;
      vertical-align: middle;
      cursor: pointer;
    }
    .inline-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }

    /* 調色盤按鈕與 Office 風格彈出面板 */
    .palette-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .palette-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .palette-swatch-preview {
      width: 18px;
      height: 18px;
      border: 1px solid #64748b;
      border-radius: 3px;
      background: #ff0000;
      display: inline-block;
    }
    .palette-popover {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 236px;
      background: #ffffff;
      border: 1px solid #94a3b8;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      border-radius: 4px;
      padding: 4px;
      z-index: 100;
      user-select: none;
    }
    .palette-popover.open {
      display: block;
    }
    .palette-auto-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 13px;
    }
    .palette-auto-row:hover {
      background: #e2e8f0;
    }
    .palette-auto-box {
      width: 18px;
      height: 18px;
      background: #ff0000;
      border: 1px solid #64748b;
    }
    .palette-section-title {
      background: #dde7f5;
      color: #1e3a8a;
      font-size: 12px;
      font-weight: bold;
      padding: 3px 6px;
      margin: 4px 0;
    }
    .palette-grid-10 {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
      padding: 2px 4px;
    }
    .palette-shades-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 0 3px;
      padding: 3px 4px 4px;
    }
    .palette-shade-col {
      display: flex;
      flex-direction: column;
      border: 1px solid #cbd5e1;
    }
    .palette-cell {
      width: 100%;
      height: 16px;
      border: 1px solid #cbd5e1;
      cursor: pointer;
      padding: 0;
      border-radius: 0;
    }
    .palette-shade-col .palette-cell {
      border: none;
      height: 14px;
    }
    .palette-cell:hover, .palette-cell.active-color {
      outline: 2px solid #ea580c;
      outline-offset: -1px;
      z-index: 2;
    }
    .palette-more-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      margin-top: 4px;
      border-top: 1px solid #e2e8f0;
      cursor: pointer;
      font-size: 13px;
    }
    .palette-more-row:hover {
      background: #e2e8f0;
    }

    .sticker-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 6px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
    }
    .sticker-btn:hover {
      background: #eff6ff;
      border-color: #3b82f6;
    }
    #viewer-container {
      flex: 1;
      overflow: auto;
      padding: 0;
      text-align: left;
    }
    #viewer-container.hand-mode {
      cursor: grab;
    }
    #viewer-container.hand-mode.hand-grabbing {
      cursor: grabbing;
      user-select: none;
    }
    #canvas-stack {
      position: relative;
      display: inline-block;
      margin: 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      background: #fff;
    }
    #pdf-canvas {
      display: block;
    }
    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
      z-index: 3;
    }
    #vector-draw-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 4;
    }
    #vector-draw-layer.drawing-active {
      pointer-events: auto;
      touch-action: none;
    }
    .vector-shape-group {
      cursor: pointer;
      pointer-events: auto;
    }
    .vector-shape-group.selected {
      filter: drop-shadow(0 0 4px rgba(29, 78, 216, 0.85));
    }
    #eraser-cursor {
      display: none;
      position: absolute;
      border: 1.5px solid #334155;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.85);
      z-index: 9;
    }
    #overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
    }
    #overlay-layer.text-placing {
      pointer-events: auto;
      cursor: text;
    }
    .vector-sticker-item {
      position: absolute;
      cursor: move;
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      z-index: 6;
    }
    .vector-sticker-item svg {
      display: block;
      overflow: visible;
    }
    .vector-sticker-item.selected svg {
      filter: drop-shadow(0 0 4px rgba(29, 78, 216, 0.7));
    }
    .sticker-del-badge {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 3px;
      background: #dc2626;
      color: #fff;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      z-index: 12;
    }
    .vector-sticker-item.selected .sticker-del-badge {
      display: inline-block;
    }
    .floating-text-box {
      position: absolute;
      padding: 4px 8px;
      border: 1px dashed rgba(29, 78, 216, 0.65);
      background: rgba(255, 255, 255, 0.88);
      border-radius: 4px;
      cursor: move;
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      line-height: 1.25;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      font-weight: bold;
      z-index: 7;
      white-space: pre-wrap;
    }
    .floating-text-box.selected {
      border: 1.5px solid #1d4ed8;
      box-shadow: 0 2px 8px rgba(29, 78, 216, 0.25);
    }
    .floating-text-actions {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 4px;
      gap: 4px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 12px;
      font-weight: normal;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      white-space: nowrap;
      z-index: 10;
    }
    .floating-text-box.selected .floating-text-actions {
      display: inline-flex;
    }
    .floating-text-actions span {
      cursor: pointer;
      padding: 1px 5px;
      color: #1e293b;
    }
    .floating-text-actions span:hover {
      background: #e2e8f0;
      border-radius: 3px;
    }
    .floating-text-actions span.del-btn {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h2>圖層 (Layers)</h2>
    <div id="layers-list">正在載入 PDF 與圖層...</div>
  </aside>

  <section id="main">
    <div class="toolbar">
      <button id="toggle-sidebar">收合圖層</button>
      <span class="toolbar-divider"></span>
      <button id="zoom-out">縮小 (-)</button>
      <span id="zoom-label">150%</span>
      <button id="zoom-in">放大 (+)</button>
      <button id="zoom-150">150%</button>
      <button id="zoom-reset">重設 100%</button>
      <span class="toolbar-divider"></span>
      <button id="tool-hand-top" title="手抓工具：按住上下左右拖曳移動圖面">🖐 手抓移動</button>
      <span class="toolbar-divider"></span>
      <button id="layers-check-all">全部勾選</button>
      <button id="layers-uncheck-all">全部取消</button>
    </div>

    <div class="toolbar draw-bar">
      <strong style="font-size: 13.5px;">繪圖工具：</strong>
      <button id="tool-none" class="active">瀏覽模式</button>
      <button id="tool-hand" title="按住圖面上下左右拖曳移動">🖐 手抓移動</button>
      <button id="tool-pen">隨意畫線</button>
      <button id="tool-line">直線</button>
      <button id="tool-arrow">箭頭</button>
      <button id="tool-circle">圓形</button>
      <button id="tool-rect">正方形</button>
      <button id="tool-text">加文字</button>

      <span class="inline-group">
        <button id="tool-eraser">橡皮擦</button>
        <input type="range" id="eraser-size" min="8" max="60" value="20" title="橡皮擦大小" />
        <span id="eraser-size-label">20</span>
      </span>

      <span class="toolbar-divider"></span>

      <!-- Office 風格調色盤 -->
      <div class="palette-wrapper" id="palette-wrapper">
        <button type="button" class="palette-trigger" id="palette-trigger" title="開啟調色盤">
          <span>顏色</span>
          <span class="palette-swatch-preview" id="palette-preview"></span>
          <span style="font-size: 10px;">▼</span>
        </button>
        <input type="color" id="draw-color" value="#ff0000" style="position:absolute; opacity:0; width:0; height:0; pointer-events:none;" />
        <div class="palette-popover" id="palette-popover">
          <div class="palette-auto-row" id="palette-auto-btn">
            <span class="palette-auto-box"></span>
            <span>自動(A)</span>
          </div>
          <div class="palette-section-title">佈景主題色彩</div>
          <div class="palette-grid-10" id="palette-theme-top"></div>
          <div class="palette-shades-grid" id="palette-theme-shades"></div>
          <div class="palette-section-title">標準色彩</div>
          <div class="palette-grid-10" id="palette-standard"></div>
          <div class="palette-more-row" id="palette-more-btn">
            <span>🎨</span>
            <span>其他色彩(M)...</span>
          </div>
        </div>
      </div>

      <label class="inline-group">線寬
        <select id="line-width">
          <option value="2">細</option>
          <option value="5" selected>中等</option>
          <option value="9">粗</option>
        </select>
      </label>

      <label class="inline-group">字級(8-36)
        <input type="number" id="font-size" min="8" max="36" value="20" />
      </label>

      <button id="draw-undo" disabled>復原上一步</button>
      <button id="draw-clear">清除筆跡</button>
      <span class="toolbar-divider"></span>
      <button id="download-png">下載 PNG</button>
    </div>

    <div class="toolbar sticker-bar">
      <strong style="font-size: 13.5px;">向量貼紙區：</strong>
      <div id="sticker-buttons" style="display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;"></div>
      <span class="toolbar-divider"></span>
      <label class="inline-group">貼紙大小
        <input type="range" id="sticker-scale" min="0.5" max="2.5" step="0.1" value="1" />
        <span id="sticker-scale-label">1.0x</span>
      </label>
    </div>

    <div id="viewer-container">
      <div id="canvas-stack">
        <canvas id="pdf-canvas"></canvas>
        <canvas id="draw-canvas"></canvas>
        <svg id="vector-draw-layer" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="eraser-cursor"></div>
        <div id="overlay-layer"></div>
      </div>
    </div>
  </section>

  <script>
    window.addEventListener('error', (ev) => {
      const el = document.getElementById('layers-list');
      if (el && el.textContent.includes('正在載入')) {
        el.textContent = `腳本錯誤：${ev.message || '請按 F12 → 主控台查看'}`;
      }
    });
    window.addEventListener('unhandledrejection', (ev) => {
      const el = document.getElementById('layers-list');
      if (el && el.textContent.includes('正在載入')) {
        const reason = ev.reason?.message || String(ev.reason || '載入失敗');
        el.textContent = `載入錯誤：${reason}`;
      }
    });
  </script>
